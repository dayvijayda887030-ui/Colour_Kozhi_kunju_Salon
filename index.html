<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colour Kozhi Kunji Salon</title>
<meta name="description" content="Colour Kozhi Kunji Salon — hair, colour, chaos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="cur"></div>
<div class="loader" id="loader"><img class="loader-mascot" src="assets/Rainbow%20Feathered%20Chick%20Mascot.png" alt=""></div>

<nav class="nav">
  <a href="#top" class="logo f">KKS <img class="chick-mark" src="assets/Rainbow%20Feathered%20Chick%20Mascot.png" alt=""></a>
  <div><a href="#about">About</a><a href="#looks">Looks</a><a href="#reels">Reels</a><a href="#watch">Watch</a><a href="#find">Find us</a></div>
</nav>

<header class="hero" id="top">
  <h1 class="giant f" aria-label="Colour Kozhi Kunji"><span>COLOUR</span><span class="fill">KOZHI</span><span>KUNJI</span></h1>
  <div class="owner" data-depth="14"><img id="ownerImg" alt="Owner"></div>
  <div class="stk s1 f" id="st1" data-depth="30"></div>
  <div class="stk s2 f" id="st2" data-depth="-26"></div>
  <div class="stk s3 f" id="st3" data-depth="22"></div>
  <svg class="badge" viewBox="0 0 200 200" aria-hidden="true">
    <defs><path id="circ" d="M100,100 m-75,0 a75,75 0 1,1 150,0 a75,75 0 1,1 -150,0"/></defs>
    <text class="f"><textPath href="#circ">SCROLL ✦ SCROLL ✦ SCROLL ✦ SCROLL ✦</textPath></text>
    <image href="assets/Rainbow%20Feathered%20Chick%20Mascot.png" x="72" y="72" width="56" height="56" preserveAspectRatio="xMidYMid meet"/>
  </svg>
  <p class="cap f" id="heroCap"></p>
  <p class="sub" id="heroSub"></p>
  <a class="btn f" href="#find" data-cursor="GO">Visit us ➜</a>
</header>

<div class="marquee"><div class="mq" id="mq1"></div></div>
<div class="marquee rev"><div class="mq" id="mq2"></div></div>

<section class="about" id="about">
  <div class="about-copy">
    <p class="about-kicker f">THE CREATIVE BEHIND THE CHAOS</p>
    <h2 class="f">MEET THE<br><span>COLOUR BOSS</span></h2>
    <p class="about-name f" id="ownerName"></p>
    <p class="about-bio" id="ownerBio"></p>
  </div>
  <figure class="about-photo"><img id="aboutOwnerImg" alt="Salon owner"></figure>
</section>

<section class="hscroll" id="looks"><div class="track" id="hTrack"></div></section>

<section class="wall" id="wall">
  <h2 class="f sec">THE WALL <small>✂️</small></h2>
  <div class="cols" id="cols"></div>
</section>

<section class="slsec pinkbg" id="reels">
  <div class="slhead"><h2 class="f sec">REELS <small>📸</small></h2><div class="ctrl"><button class="arr" data-dir="-1" data-cursor="‹">‹</button><button class="arr" data-dir="1" data-cursor="›">›</button></div></div>
  <div class="slider" id="igSlider" data-cursor="DRAG"></div>
</section>

<section class="slsec" id="watch">
  <div class="slhead"><h2 class="f sec lime">WATCH <small>▶️</small></h2><div class="ctrl"><button class="arr" data-dir="-1" data-cursor="‹">‹</button><button class="arr" data-dir="1" data-cursor="›">›</button></div></div>
  <div class="slider" id="ytSlider" data-cursor="DRAG"></div>
</section>

<section class="find" id="find">
  <h2 class="f sec">FIND US <small>📍</small></h2>
  <div class="tabs" id="mapTabs"></div>
  <div class="mapbox"><iframe id="mapFrame" title="Map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe></div>
  <a class="btn f" id="mapOpen" target="_blank" rel="noopener" href="#">Open in Maps ➜</a>
</section>

<footer>
  <div class="big f">BYE<br>BYE <img class="footer-mascot" src="assets/Rainbow%20Feathered%20Chick%20Mascot.png" alt=""></div>
  <div class="soc">
    <a class="f" id="fIg" target="_blank" rel="noopener" data-cursor="IG">Instagram</a>
    <a class="f" id="fYt" target="_blank" rel="noopener" data-cursor="YT">YouTube</a>
    <a class="f" id="fPh" style="display:none" data-cursor="CALL">Call</a>
  </div>
  <div class="tiny"><span>© Colour Kozhi Kunji Salon</span><a id="fFb" target="_blank" rel="noopener">facebook</a><a href="/admin">admin</a></div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
