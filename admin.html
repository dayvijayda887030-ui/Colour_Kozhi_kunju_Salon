<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin · Colour Kozhi Kunji</title>
<link rel="icon" type="image/png" href="assets/Rainbow%20Feathered%20Chick%20Mascot.png">
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff2e93;--lime:#c6ff00;--purple:#6c2bff;--cream:#fff4e0;--ink:#0d0d0d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Space Grotesk',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh}
.f{font-family:'Bagel Fat One',cursive;font-weight:400}
a{color:inherit}
input,select,textarea,button{font:inherit}
input,select{width:100%;padding:11px 14px;border:3px solid var(--ink);border-radius:14px;background:#fff}
button{cursor:pointer;padding:10px 18px;border:3px solid var(--ink);border-radius:99px;background:var(--lime);font-weight:700;box-shadow:3px 3px 0 var(--ink);transition:.15s}
button:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
button.ghost{background:#fff}button.danger{background:var(--pink);color:#fff}
#login{max-width:400px;margin:12vh auto;padding:30px;background:#fff;border:4px solid var(--ink);border-radius:30px;box-shadow:10px 10px 0 var(--pink)}
#login h1{font-size:34px;margin-bottom:18px;color:var(--pink)}
#login h1 img{width:42px;height:48px;object-fit:contain;vertical-align:middle}
#login input{margin-bottom:12px}
#err{color:#c00;font-weight:600;margin-top:10px;min-height:20px}
header{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 4vw;background:var(--ink);color:var(--cream)}
header h1{font-size:26px;color:var(--lime)}
header .who{display:flex;gap:12px;align-items:center;font-size:14px}
.role{background:var(--pink);padding:3px 12px;border-radius:99px;font-weight:700;font-size:12px}
nav{display:flex;gap:8px;flex-wrap:wrap;padding:16px 4vw 0}
nav button.on{background:var(--ink);color:var(--lime)}
main{padding:20px 4vw 60px;max-width:1100px}
.card{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:20px;margin-bottom:18px;box-shadow:6px 6px 0 var(--purple)}
.card h2{margin-bottom:14px;font-size:24px}
.row{display:grid;grid-template-columns:200px 1fr auto;gap:10px;align-items:center;margin-bottom:10px}
.row label{font-weight:700;font-size:14px}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.inline input{flex:1;min-width:160px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.g{border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:var(--cream)}
.g img{width:100%;height:150px;object-fit:cover;display:block}
.g .b{padding:8px;display:flex;flex-direction:column;gap:6px}
.g .b div{display:flex;gap:4px}.g .b button{padding:4px 10px;font-size:13px;box-shadow:none}
.list>div{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:2px dashed #ccc;flex-wrap:wrap}
.list b{flex:1;min-width:200px;word-break:break-all}
.tag{background:var(--lime);border:2px solid var(--ink);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
.hint{font-size:13px;opacity:.7;margin-bottom:12px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--lime);padding:12px 24px;border-radius:99px;font-weight:700;display:none;z-index:10}
#toast.bad{background:var(--pink);color:#fff}
.hidden{display:none!important}
@media(max-width:700px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login">
  <h1 class="f">Admin <img src="assets/Rainbow%20Feathered%20Chick%20Mascot.png" alt=""></h1>
  <form id="loginForm">
    <input id="em" type="email" placeholder="Email" required autocomplete="username">
    <input id="pw" type="password" placeholder="Password" required autocomplete="current-password">
    <button type="submit">Login ➜</button>
    <div id="err"></div>
  </form>
  <p style="margin-top:14px;font-size:13px"><a href="/">← back to site</a></p>
</div>

<div id="app" class="hidden">
  <header>
    <h1 class="f">Kozhi Kunji Admin</h1>
    <div class="who"><span id="me"></span><span class="role" id="role"></span><button class="ghost" id="out">Logout</button></div>
  </header>
  <nav id="tabs"></nav>
  <main id="view"></main>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
